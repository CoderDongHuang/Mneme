services:
  frontend:
    build:
      context: ./frontend
      args:
        NODE_BASE_IMAGE: ${MNEME_NODE_BASE_IMAGE:-node:22-alpine}
        CADDY_BASE_IMAGE: ${MNEME_CADDY_BASE_IMAGE:-caddy:2.9-alpine}
    ports:
      - "3000:80"
    environment:
      PUBLIC_DOMAIN: ":80"
    depends_on:
      - java-gateway

  java-gateway:
    environment:
      SECURE_COOKIES: "false"
      CORS_ORIGINS: "http://localhost:3000"

  python-agent:
    volumes:
      - ./test-fixtures:/test-fixtures:ro
