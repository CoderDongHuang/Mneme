[pytest]
markers =
    integration: 集成测试，需要真实后端环境运行

# These are known upstream warnings from the pinned Starlette/Chroma versions.
# Keep filters module- and message-scoped so new project warnings remain visible.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette.testclient
    ignore:The 'warn' method is deprecated.*:DeprecationWarning:chromadb.db.impl.sqlite
    ignore:Accessing the 'model_fields' attribute on the instance is deprecated.*:pydantic.warnings.PydanticDeprecatedSince211:chromadb.types
