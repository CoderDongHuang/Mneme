services:
  frontend:
    build:
      context: ./frontend
      args:
        NODE_BASE_IMAGE: ${MNEME_NODE_BASE_IMAGE:-node:22-alpine}
        CADDY_BASE_IMAGE: ${MNEME_CADDY_BASE_IMAGE:-caddy:2.9-alpine}
    restart: unless-stopped
    depends_on:
      - java-gateway
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
  mysql:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  chroma:
    restart: unless-stopped
  python-agent:
    restart: unless-stopped
    environment:
      AUXILIARY_STORE_BACKEND: ${AUXILIARY_STORE_BACKEND:-mysql}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mneme}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:-${SPRING_DATASOURCE_PASSWORD}}}
  java-gateway:
    restart: unless-stopped
    environment:
      SECURE_COOKIES: "true"
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
