services:
  frontend:
    image: ${MNEME_FRONTEND_IMAGE:?Production requires a versioned frontend image or digest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NODE_BASE_IMAGE: ${MNEME_NODE_BASE_IMAGE:-node:22-alpine}
        CADDY_BASE_IMAGE: ${MNEME_CADDY_BASE_IMAGE:-caddy:2.9-alpine}
    restart: unless-stopped
    depends_on:
      - java-gateway
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
  mysql:
    restart: unless-stopped
  mysql-users:
    environment:
      MYSQL_GATEWAY_PASSWORD: ${MYSQL_GATEWAY_PASSWORD:?Production requires a Gateway DML password}
      MYSQL_AGENT_PASSWORD: ${MYSQL_AGENT_PASSWORD:?Production requires an Agent DML password}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?Production requires a migration password}
  redis:
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Production requires a non-empty REDIS_PASSWORD}
  qdrant:
    restart: unless-stopped
  python-agent:
    image: ${MNEME_PYTHON_IMAGE:?Production requires a versioned Python image or digest}
    restart: unless-stopped
    environment:
      AUXILIARY_STORE_BACKEND: ${AUXILIARY_STORE_BACKEND:-mysql}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mneme}
      MYSQL_USER: mneme_agent
      MYSQL_PASSWORD: ${MYSQL_AGENT_PASSWORD:?Production requires an Agent DML password}
  java-gateway:
    image: ${MNEME_JAVA_IMAGE:?Production requires a versioned gateway image or digest}
    restart: unless-stopped
    environment:
      MNEME_PRODUCTION: "true"
      SPRING_DATASOURCE_USERNAME: mneme_gateway
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_GATEWAY_PASSWORD:?Production requires a Gateway DML password}
      SPRING_FLYWAY_USER: mneme_migrator
      SPRING_FLYWAY_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?Production requires a migration password}
      MODEL_CONFIG_ENCRYPTION_KEY: ${MODEL_CONFIG_ENCRYPTION_KEY:?Production requires an independent model configuration encryption key}
      SECURE_COOKIES: "true"
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
