services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${SPRING_DATASOURCE_PASSWORD}}
      MYSQL_DATABASE: mneme
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  clamav:
    image: clamav/clamav:1.4
    profiles: ["security"]
    volumes:
      - clamav-signatures:/var/lib/clamav

  chroma:
    image: chromadb/chroma:0.5.3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/chroma:/chroma/data
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000

  python-agent:
    build: ./python-agent
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - MNEME_OFFLINE_EMBEDDINGS=${MNEME_OFFLINE_EMBEDDINGS:-false}
      - MNEME_DETERMINISTIC_TEST_LLM=${MNEME_DETERMINISTIC_TEST_LLM:-false}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - INTERNAL_SERVICE_TOKEN_PREVIOUS=${INTERNAL_SERVICE_TOKEN_PREVIOUS:-}
      - CHROMA_MODE=http
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - VECTOR_SHARD_COUNT=${VECTOR_SHARD_COUNT:-1}
      - VECTOR_SHARD_URLS=${VECTOR_SHARD_URLS:-}
      - AGENT_TOOL_TIMEOUT_SECONDS=${AGENT_TOOL_TIMEOUT_SECONDS:-8}
      - AGENT_TOOL_MAX_ATTEMPTS=${AGENT_TOOL_MAX_ATTEMPTS:-2}
      - AGENT_TRACE_REDACT_FIELDS=${AGENT_TRACE_REDACT_FIELDS:-content,message,query,question,answer,prompt,token,password,secret,api_key}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-24}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SKIP_INTERNAL_AUTH=false
      - WORKING_MEMORY_WINDOW_SIZE=${WORKING_MEMORY_WINDOW_SIZE:-10}
      - WORKING_MEMORY_MAX_TOKENS=${WORKING_MEMORY_MAX_TOKENS:-4000}
      - RETRIEVER_TOP_K=${RETRIEVER_TOP_K:-5}
      - RETRIEVER_CONTEXT_MAX_CHARS=${RETRIEVER_CONTEXT_MAX_CHARS:-12000}
      - RERANKER_ENABLED=${RERANKER_ENABLED:-false}
      - RERANKER_PROVIDER=${RERANKER_PROVIDER:-dashscope}
      - RERANKER_MODEL=${RERANKER_MODEL:-gte-rerank-v2}
      - DISTILLATION_IDLE_MINUTES=${DISTILLATION_IDLE_MINUTES:-15}
      - OCR_ENABLED=${OCR_ENABLED:-true}
      - OCR_LANGUAGES=${OCR_LANGUAGES:-chi_sim+eng}
      - PDF_MIN_TEXT_CHARS=${PDF_MIN_TEXT_CHARS:-80}
      - MULTIMODAL_ENABLED=${MULTIMODAL_ENABLED:-false}
      - MULTIMODAL_MODEL=${MULTIMODAL_MODEL:-qwen-vl-plus}
      - MULTIMODAL_MAX_IMAGES=${MULTIMODAL_MAX_IMAGES:-8}
    volumes:
      - ./data:/data
      - ./python-agent:/app
    depends_on:
      chroma:
        condition: service_started

  java-gateway:
    build: ./java-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/mneme
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-${SPRING_DATASOURCE_PASSWORD}}
      - REDIS_HOST=redis
      - NOTIFICATION_REDIS_ENABLED=true
      - PYTHON_AGENT_URL=http://python-agent:8001
      - FILE_STORAGE_PATH=/data/files
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - OBJECT_STORAGE_ENDPOINT=${OBJECT_STORAGE_ENDPOINT:-}
      - OBJECT_STORAGE_ACCESS_KEY=${OBJECT_STORAGE_ACCESS_KEY:-}
      - OBJECT_STORAGE_SECRET_KEY=${OBJECT_STORAGE_SECRET_KEY:-}
      - OBJECT_STORAGE_BUCKET=${OBJECT_STORAGE_BUCKET:-mneme}
      - TENANT_STORAGE_QUOTA_MB=${TENANT_STORAGE_QUOTA_MB:-2048}
      - TENANT_KNOWLEDGE_BASE_QUOTA=${TENANT_KNOWLEDGE_BASE_QUOTA:-100}
      - AVATAR_STORAGE_PATH=/data/avatars
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - INTERNAL_SERVICE_TOKEN_PREVIOUS=${INTERNAL_SERVICE_TOKEN_PREVIOUS:-}
      - PASSWORD_RESET_FROM=${PASSWORD_RESET_FROM:-mneme@local.test}
      - MALWARE_SCAN_ENABLED=${MALWARE_SCAN_ENABLED:-false}
      - MALWARE_SCAN_FAIL_CLOSED=${MALWARE_SCAN_FAIL_CLOSED:-true}
      - CLAMAV_HOST=${CLAMAV_HOST:-clamav}
      - CLAMAV_PORT=${CLAMAV_PORT:-3310}
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=false
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=false
    volumes:
      - ./data:/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
      python-agent:
        condition: service_started

volumes:
  clamav-signatures:
