services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${SPRING_DATASOURCE_PASSWORD}}
      MYSQL_DATABASE: mneme
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent --skip-column-names -e 'SELECT 1 FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME=\"mneme\"' | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:1.4
    profiles: ["security"]
    volumes:
      - clamav-signatures:/var/lib/clamav

  qdrant-init:
    build: ./docker/qdrant
    image: ${MNEME_QDRANT_IMAGE:-mneme-qdrant:1.20.0}
    user: "0:0"
    network_mode: none
    restart: "no"
    entrypoint: ["chown"]
    command: ["-R", "10001:10001", "/qdrant/storage"]
    volumes:
      - ./data/qdrant:/qdrant/storage

  qdrant:
    build: ./docker/qdrant
    image: ${MNEME_QDRANT_IMAGE:-mneme-qdrant:1.20.0}
    depends_on:
      qdrant-init:
        condition: service_completed_successfully
    networks: [vector-backend]
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: [CMD-SHELL, 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.0\r\n\r\n" >&3; read -r status <&3; [[ "$$status" == *"200"* ]]''']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 180s

  python-agent:
    build:
      context: ./python-agent
      args:
        PYTHON_BASE_IMAGE: ${MNEME_PYTHON_BASE_IMAGE:-python:3.11-slim}
    networks:
      - default
      - vector-backend
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - MNEME_OFFLINE_EMBEDDINGS=${MNEME_OFFLINE_EMBEDDINGS:-false}
      - MNEME_DETERMINISTIC_TEST_LLM=${MNEME_DETERMINISTIC_TEST_LLM:-false}
      - LLM_DAILY_BUDGET_USD=${LLM_DAILY_BUDGET_USD:-0}
      - LLM_PRIMARY_INPUT_COST_PER_MILLION=${LLM_PRIMARY_INPUT_COST_PER_MILLION:-0}
      - LLM_PRIMARY_OUTPUT_COST_PER_MILLION=${LLM_PRIMARY_OUTPUT_COST_PER_MILLION:-0}
      - LLM_FALLBACK_INPUT_COST_PER_MILLION=${LLM_FALLBACK_INPUT_COST_PER_MILLION:-0}
      - LLM_FALLBACK_OUTPUT_COST_PER_MILLION=${LLM_FALLBACK_OUTPUT_COST_PER_MILLION:-0}
      - LLM_DEFAULT_MAX_OUTPUT_TOKENS=${LLM_DEFAULT_MAX_OUTPUT_TOKENS:-1024}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - INTERNAL_SERVICE_TOKEN_PREVIOUS=${INTERNAL_SERVICE_TOKEN_PREVIOUS:-}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - VECTOR_STORE_MODE=http
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - VECTOR_SHARD_COUNT=${VECTOR_SHARD_COUNT:-1}
      - VECTOR_SHARD_URLS=${VECTOR_SHARD_URLS:-}
      - AGENT_TOOL_TIMEOUT_SECONDS=${AGENT_TOOL_TIMEOUT_SECONDS:-8}
      - AGENT_TOOL_MAX_ATTEMPTS=${AGENT_TOOL_MAX_ATTEMPTS:-2}
      - AGENT_TRACE_REDACT_FIELDS=${AGENT_TRACE_REDACT_FIELDS:-content,message,query,question,answer,prompt,token,password,secret,api_key}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-24}
      - AUXILIARY_STORE_BACKEND=${AUXILIARY_STORE_BACKEND:-sqlite}
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-mneme}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:-${SPRING_DATASOURCE_PASSWORD}}}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SKIP_INTERNAL_AUTH=false
      - WORKING_MEMORY_WINDOW_SIZE=${WORKING_MEMORY_WINDOW_SIZE:-10}
      - WORKING_MEMORY_MAX_TOKENS=${WORKING_MEMORY_MAX_TOKENS:-4000}
      - RETRIEVER_REWRITE_ENABLED=${RETRIEVER_REWRITE_ENABLED:-true}
      - RETRIEVER_FOCUS_GATE_ENABLED=${RETRIEVER_FOCUS_GATE_ENABLED:-true}
      - RETRIEVER_TOP_K=${RETRIEVER_TOP_K:-5}
      - RETRIEVER_CONTEXT_MAX_CHARS=${RETRIEVER_CONTEXT_MAX_CHARS:-12000}
      - RERANKER_ENABLED=${RERANKER_ENABLED:-false}
      - RERANKER_PROVIDER=${RERANKER_PROVIDER:-dashscope}
      - RERANKER_MODEL=${RERANKER_MODEL:-gte-rerank-v2}
      - RERANKER_MIN_SCORE=${RERANKER_MIN_SCORE:-0}
      - DISTILLATION_IDLE_MINUTES=${DISTILLATION_IDLE_MINUTES:-15}
      - OCR_ENABLED=${OCR_ENABLED:-true}
      - OCR_LANGUAGES=${OCR_LANGUAGES:-chi_sim+eng}
      - PDF_MIN_TEXT_CHARS=${PDF_MIN_TEXT_CHARS:-80}
      - MULTIMODAL_ENABLED=${MULTIMODAL_ENABLED:-false}
      - MULTIMODAL_MODEL=${MULTIMODAL_MODEL:-qwen3-vl-plus}
      - MULTIMODAL_MAX_IMAGES=${MULTIMODAL_MAX_IMAGES:-8}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_PYTHON_SERVICE_NAME:-mneme-python-agent}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-0.1}
    volumes:
      - ./data:/data
      - ./python-agent:/app
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  java-gateway:
    build:
      context: ./java-gateway
      args:
        MAVEN_BASE_IMAGE: ${MNEME_MAVEN_BASE_IMAGE:-maven:3.9-eclipse-temurin-17}
        JAVA_BASE_IMAGE: ${MNEME_JAVA_BASE_IMAGE:-eclipse-temurin:17-jre-alpine}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/mneme?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-${SPRING_DATASOURCE_PASSWORD}}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - NOTIFICATION_REDIS_ENABLED=true
      - PYTHON_AGENT_URL=http://python-agent:8001
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - RECOVERY_GITHUB_REPOSITORY=${RECOVERY_GITHUB_REPOSITORY:-}
      - RECOVERY_GITHUB_TOKEN=${RECOVERY_GITHUB_TOKEN:-}
      - RECOVERY_WORKER_URL=${RECOVERY_WORKER_URL:-}
      - RECOVERY_WORKER_TOKEN=${RECOVERY_WORKER_TOKEN:-}
      - MODEL_CONFIG_ENCRYPTION_KEY=${MODEL_CONFIG_ENCRYPTION_KEY:-}
      - MODEL_CONFIG_KEY_VERSION=${MODEL_CONFIG_KEY_VERSION:-v2}
      - MODEL_CONFIG_PREVIOUS_KEYS=${MODEL_CONFIG_PREVIOUS_KEYS:-{}}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-}
      - FILE_STORAGE_PATH=/data/files
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - OBJECT_STORAGE_ENDPOINT=${OBJECT_STORAGE_ENDPOINT:-}
      - OBJECT_STORAGE_ACCESS_KEY=${OBJECT_STORAGE_ACCESS_KEY:-}
      - OBJECT_STORAGE_SECRET_KEY=${OBJECT_STORAGE_SECRET_KEY:-}
      - OBJECT_STORAGE_BUCKET=${OBJECT_STORAGE_BUCKET:-mneme}
      - TENANT_STORAGE_QUOTA_MB=${TENANT_STORAGE_QUOTA_MB:-2048}
      - TENANT_KNOWLEDGE_BASE_QUOTA=${TENANT_KNOWLEDGE_BASE_QUOTA:-100}
      - AVATAR_STORAGE_PATH=/data/avatars
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - INTERNAL_SERVICE_TOKEN_PREVIOUS=${INTERNAL_SERVICE_TOKEN_PREVIOUS:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12}
      - PASSWORD_RESET_FROM=${PASSWORD_RESET_FROM:-}
      - MALWARE_SCAN_ENABLED=${MALWARE_SCAN_ENABLED:-false}
      - MALWARE_SCAN_FAIL_CLOSED=${MALWARE_SCAN_FAIL_CLOSED:-true}
      - CLAMAV_HOST=${CLAMAV_HOST:-clamav}
      - CLAMAV_PORT=${CLAMAV_PORT:-3310}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_JAVA_EXPORTER_ENDPOINT:-http://localhost:4318/v1/traces}
      - OTEL_SERVICE_NAME=${OTEL_JAVA_SERVICE_NAME:-mneme-java-gateway}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-0.1}
    volumes:
      - ./data:/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-agent:
        condition: service_healthy

volumes:
  clamav-signatures:

networks:
  vector-backend:
    internal: true
