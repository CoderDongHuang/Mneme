<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mneme - 学习助手</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/bash.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css" id="hljs-theme">
</head>
<body>

<div id="auth-overlay" class="auth-overlay">
    <div class="auth-box">
        <div class="auth-header">
            <h2>Mneme</h2>
            <p>记住你 · 了解你 · 主动帮你</p>
        </div>
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">登录</button>
            <button class="auth-tab" data-tab="register">注册</button>
        </div>
        <form id="login-form" class="auth-form">
            <input id="login-user" placeholder="用户名" autocomplete="username">
            <input id="login-pass" type="password" placeholder="密码" autocomplete="current-password">
            <button type="submit">登录</button>
            <div class="auth-err" id="login-error"></div>
        </form>
        <form id="register-form" class="auth-form hidden">
            <input id="reg-user" placeholder="用户名 (至少3个字符)" minlength="3">
            <input id="reg-pass" type="password" placeholder="密码 (至少6个字符)" minlength="6">
            <input id="reg-pass2" type="password" placeholder="确认密码">
            <button type="submit">注册</button>
            <div class="auth-err" id="register-error"></div>
        </form>
        <button id="auth-skip" class="auth-skip">跳过登录（开发模式）</button>
    </div>
</div>

<div id="app" class="app-layout hidden">
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-hd">
            <button id="new-chat-btn" class="btn-new-chat">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                新对话
            </button>
            <div class="sidebar-search-wrap">
                <input id="session-search" class="sidebar-search-input" placeholder="搜索对话..." type="search">
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-group">
                <div class="nav-label">知识库</div>
                <div id="kb-list"></div>
            </div>
            <div class="nav-group">
                <div class="nav-label">历史对话</div>
                <div id="session-list"></div>
            </div>
        </nav>
        <div class="sidebar-ft">
            <span id="memory-brief" class="memory-brief">暂无记忆数据</span>
            <div class="sidebar-ft-actions">
                <button id="theme-toggle" class="btn-icon" title="切换主题">🌓</button>
                <span id="conn-dot" class="conn-dot off"></span>
            </div>
        </div>
    </aside>

    <main class="main">
        <header class="header">
            <button id="menu-btn" class="btn-icon menu-btn">☰</button>
            <span id="chat-title" class="header-title">新对话</span>
            <button id="stop-btn" class="btn-stop hidden">停止</button>
        </header>

        <div id="messages" class="messages">
            <div class="empty-state">
                <h1>Mneme</h1>
                <p>上传课件、提问、复习——我会记住你的学习轨迹</p>
            </div>
        </div>

        <div class="input-wrap">
            <div class="input-box">
                <input type="file" id="file-input" hidden accept=".pdf,.docx,.doc,.md,.txt">
                <button id="upload-btn" class="btn-upload" title="上传文件">📎</button>
                <textarea id="user-input" class="chat-input" placeholder="输入消息..." rows="1"></textarea>
                <button id="send-btn" class="btn-send" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
            <div id="upload-status" class="upload-status hidden">
                <div class="upload-bar-bg"><div class="upload-bar-fill"></div></div>
                <span class="upload-text"></span>
            </div>
        </div>
    </main>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
