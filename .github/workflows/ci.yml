name: Mneme CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-agent/requirements.txt
      - run: pip install -r python-agent/requirements.txt pytest ruff
      - run: ruff check python-agent/
      - name: Run Python tests
        working-directory: python-agent
        env:
          DEEPSEEK_API_KEY: ci-dummy-key
          DASHSCOPE_API_KEY: ci-dummy-key
          MNEME_OFFLINE_EMBEDDINGS: "true"
        run: python -m pytest tests/ -q

  java:
    name: Java Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build gateway
        working-directory: java-gateway
        run: mvn --batch-mode test

  frontend:
    name: React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run audit
          npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e
