name: Mneme CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-demo:
    name: Offline demo clean install
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start isolated demo without provider keys
        run: python scripts/demo.py start
      - name: Verify real demo workflow
        working-directory: frontend
        env:
          MNEME_DEMO_E2E: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80mneme-ci >/dev/null
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test e2e/demo-stack.spec.js --project=桌面端
      - name: Collect demo logs
        if: failure()
        run: python scripts/demo.py logs > demo-services.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-demo-acceptance
          path: |
            frontend/test-results/
            demo-services.log
      - name: Clean only demo volumes
        if: always()
        run: python scripts/demo.py clean --confirm-delete-demo-data

  python:
    name: Python Agent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-agent/requirements.lock
      - name: Install OCR runtime
        timeout-minutes: 5
        run: |
          # Avoid stalled Azure mirror downloads on hosted runners.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng fonts-noto-cjk
      - run: pip install --require-hashes -r python-agent/requirements.lock
      - run: pip install pytest==9.0.3 "ruff==0.15.17"
      - run: ruff check python-agent/
      - name: Run Python tests
        working-directory: python-agent
        env:
          DEEPSEEK_API_KEY: ci-dummy-key
          DASHSCOPE_API_KEY: ci-dummy-key
          MNEME_OFFLINE_EMBEDDINGS: "true"
        run: python -m pytest tests/ -q --maxfail=1
      - name: Collect Python test diagnostics
        if: failure()
        working-directory: python-agent
        run: |
          python --version
          python -m pip freeze
          python -m pytest tests/ -x -vv --tb=long
      - name: Run offline RAG regression datasets
        working-directory: python-agent
        env:
          MNEME_OFFLINE_EMBEDDINGS: "true"
        run: |
          for dataset in rag_cases adversarial_rag_cases target_domain_rag_cases retrieval_holdout_cases; do
            python scripts/evaluate_rag.py --dataset "evaluation/$dataset.json" --report "../artifacts/rag-$dataset.json"
          done
      - name: Run OCR quality gate
        working-directory: python-agent
        env:
          OCR_ENABLED: "true"
          OCR_LANGUAGES: chi_sim+eng
        run: python scripts/evaluate_document_ai.py --report ../artifacts/document-ai-ocr-report.json
      - name: Upload RAG quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rag-quality-report
          path: |
            artifacts/rag-*.json
            artifacts/document-ai-ocr-report.json

  python-windows:
    name: Python Agent Windows lock and audit
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-agent/requirements.windows.lock
      - name: Install Windows locked dependencies
        run: python -m pip install --require-hashes -r python-agent/requirements.windows.lock
      - name: Install test and audit tools
        run: python -m pip install pytest==9.0.3 "ruff==0.15.17" pip-audit==2.9.0
      - name: Run Windows lint and tests
        env:
          DEEPSEEK_API_KEY: ci-dummy-key
          DASHSCOPE_API_KEY: ci-dummy-key
          MNEME_OFFLINE_EMBEDDINGS: "true"
          SESSION_DATA_PATH: ${{ runner.temp }}\\mneme-sessions
          QDRANT_PATH: ${{ runner.temp }}\\mneme-qdrant
          LEXICAL_INDEX_PATH: ${{ runner.temp }}\\mneme-lexical.sqlite3
          MEMORY_VERSION_STORE_PATH: ${{ runner.temp }}\\mneme-versions.sqlite3
          AGENT_TRACE_STORE_PATH: ${{ runner.temp }}\\mneme-traces.sqlite3
        run: |
          python -m ruff check python-agent/
          python -m pytest python-agent/tests -q --maxfail=1 --tb=long
      - name: Audit Windows locked dependencies
        run: >-
          pip-audit --requirement python-agent/requirements.windows.lock --timeout 60

  java:
    name: Java Gateway
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build gateway
        working-directory: java-gateway
        run: mvn --batch-mode test

  external-model-quality:
    name: Real OCR and Qwen-VL quality
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-agent/requirements.lock
      - name: Install OCR runtime and Python dependencies
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80mneme-ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng fonts-noto-cjk
          pip install --require-hashes -r python-agent/requirements.lock
      - name: Run real document AI quality gate
        working-directory: python-agent
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MULTIMODAL_ENABLED: "true"
          MULTIMODAL_MODEL: qwen3-vl-plus
          MULTIMODAL_MAX_IMAGES: "1"
          OCR_ENABLED: "true"
          OCR_LANGUAGES: chi_sim+eng
        run: |
          test -n "$DASHSCOPE_API_KEY"
          python scripts/evaluate_document_ai.py --require-multimodal --report ../artifacts/document-ai-external-report.json
      - name: Upload external quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: document-ai-external-quality
          if-no-files-found: error
          path: artifacts/document-ai-external-report.json

  frontend:
    name: React Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run audit
          npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e

  full-stack:
    name: Full-stack P0 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    needs: [python, java, frontend]
    env:
      MYSQL_ROOT_PASSWORD: ci-database-password
      SPRING_DATASOURCE_PASSWORD: ci-database-password
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      INTERNAL_SERVICE_TOKEN: ci-internal-token-at-least-32-characters
      ADMIN_API_TOKEN: ci-admin-token-independent-at-least-32-characters
      RECOVERY_WORKER_TOKEN: ci-host-recovery-independent-at-least-32-characters
      RECOVERY_WORKER_URL: http://host.docker.internal:8091
      DEEPSEEK_API_KEY: ci-dummy-key
      DASHSCOPE_API_KEY: ci-dummy-key
      MNEME_OFFLINE_EMBEDDINGS: "true"
      MNEME_DETERMINISTIC_TEST_LLM: "true"
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.selfhost.yml -f docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-agent/requirements.lock
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80mneme-ci >/dev/null
          npm ci
          npx playwright install --with-deps chromium
      - name: Install host backup dependencies
        run: |
          python -m pip install --require-hashes -r python-agent/requirements.lock
          python -c "import cryptography, dotenv"
      - name: Prepare writable bind mounts
        run: |
          mkdir -p data/files data/avatars data/redis data/qdrant data/minio python-agent/data
          echo "MNEME_CI_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "MNEME_CI_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Check vector network isolation
        run: python scripts/check_vector_isolation.py
      - name: Verify immutable production code and build context
        run: python scripts/verify_immutable_images.py
      - name: Start full stack
        run: |
          $COMPOSE config --quiet
          $COMPOSE up -d --build
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null && curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          $COMPOSE ps
          exit 1
      - name: Run real browser workflow
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-real
        run: npx playwright test e2e/real-stack.spec.js --project=桌面端 --reporter=html
      - name: Verify Redis lease renewal and crash recovery
        run: $COMPOSE exec -T python-agent python scripts/check_ingestion_lease.py
      - name: Verify durable generation fencing with shared MySQL
        run: $COMPOSE exec -T -e AUXILIARY_STORE_BACKEND=mysql python-agent python scripts/check_index_generation.py
      - name: Verify Redis authentication and AOF pending-task recovery
        run: python scripts/verify_redis_durability.py
      - name: Verify least privilege deployment roles and startup order
        run: python scripts/verify_database_roles.py
      - name: Regress parsing, cancellation, filters and provider UI
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/roadmap-stack.spec.js --project=桌面端 --grep '真实解析异常|真实界面交互' --retries=0
      - name: Verify delayed tag loading preserves edits on desktop and mobile
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/tags-loading-real.spec.js --workers=1 --retries=0
      - name: Verify real upload abort and committed-response reconciliation
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/upload-cancellation-real.spec.js --workers=1 --retries=0
      - name: Verify durable lexical reconciliation without reparsing or embedding
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_INDEX_QA_FAULTS: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/index-reconciliation-real.spec.js --workers=1 --retries=0
      - name: Verify stale generation fencing on the real Gateway and indexes
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_INDEX_QA_FAULTS: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/index-generation-real.spec.js --workers=1 --retries=0
      - name: Verify deletion readback and retry on desktop and mobile
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_DELETION_QA_FAULTS: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/deletion-readback-real.spec.js --workers=1 --retries=0
      - name: Verify email ownership, reset and rebinding on desktop and mobile
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/email-verification-real.spec.js --workers=1 --retries=0
      - name: Verify profile persistence and password session revocation on desktop and mobile
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/profile-mutation-real.spec.js --workers=1 --retries=0
      - name: Verify shared display formats on desktop and mobile
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/formatters-real.spec.js --workers=1 --retries=0
      - name: Verify real task stages and safe diagnostics on desktop and mobile
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/tasks-feedback-real.spec.js --workers=1 --retries=0
      - name: Verify answer persistence before done on desktop and mobile
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/answer-terminal-real.spec.js --workers=1 --retries=0
      - name: Verify shared PDF citation contract on desktop and mobile
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/citation-contract-real.spec.js --workers=1 --retries=0
      - name: Verify explicit stop and disconnected provider cleanup on desktop and mobile
        # All provider fault hooks are scoped to a new QA account and restored.
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_STREAM_QA_FAULTS: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/chat-stop-real.spec.js --workers=1 --retries=0
      - name: Verify report UI, personal settings and archive restoration
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/report-stack.spec.js --project=桌面端 --retries=0
      - name: Exercise input rejection metrics
        run: |
          status=$(head -c 70000 /dev/zero | curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --header "X-Internal-Service-Token: $INTERNAL_SERVICE_TOKEN" --data-binary @- \
            http://127.0.0.1:8001/api/v1/chat)
          test "$status" = 413
      - name: Collect operational trend report
        run: |
          python scripts/collect_operational_trends.py \
            --url http://127.0.0.1:8001/metrics \
            --samples 3 \
            --interval 2 \
            --report artifacts/operational-trends.json
      - name: Collect measured usage policy evidence
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        run: |
          python scripts/collect_usage_policy_snapshot.py \
            --usage-report artifacts/usage-policy-snapshot.json \
            --config-report artifacts/usage-policy-config.json
          python scripts/usage_policy_report.py \
            --usage artifacts/usage-policy-snapshot.json \
            --config artifacts/usage-policy-config.json \
            --report artifacts/usage-policy-report.json
      - name: Run cross-storage deletion fault injection
        run: >-
          python scripts/full_stack_verification.py deletion
          --compose-file docker-compose.yml
          --compose-file docker-compose.selfhost.yml
          --compose-file docker-compose.ci.yml
      - name: Run backup and restore drill
        run: >-
          python scripts/full_stack_verification.py backup-restore
          --compose-file docker-compose.yml
          --compose-file docker-compose.selfhost.yml
          --compose-file docker-compose.ci.yml
      - name: Verify authenticated host backup and actual site restore
        run: >-
          python scripts/verify_site_recovery.py --confirm-disposable-stack
          --compose-file docker-compose.yml
          --compose-file docker-compose.selfhost.yml
          --compose-file docker-compose.ci.yml
      - name: Collect service logs
        if: failure()
        run: $COMPOSE logs --no-color > full-stack-services.log
      - name: Upload P0 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-stack-p0-acceptance
          if-no-files-found: warn
          path: |
            frontend/playwright-report-real/
            frontend/test-results/
            docs/images/mneme-*.png
            backups/ci/
            backups/worker-acceptance/
            artifacts/operational-trends.json
            artifacts/usage-policy-snapshot.json
            artifacts/usage-policy-config.json
            artifacts/usage-policy-report.json
            artifacts/frontend-review-20261029/responsive/
            full-stack-services.log
      - name: Stop full stack
        if: always()
        run: $COMPOSE down --volumes --remove-orphans

  distributed:
    name: Distributed scaling and tracing
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: [python, java]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate and start two-node topology
        run: |
          python scripts/check_vector_isolation.py
          docker compose -f docker-compose.scale-ci.yml config --quiet
          docker compose -f docker-compose.scale-ci.yml build
          docker compose -f docker-compose.scale-ci.yml up -d java-gateway-1
          for attempt in {1..80}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 80 ]; then
              echo "Primary gateway did not become ready after 240 seconds"
              exit 1
            fi
            sleep 3
          done
          docker compose -f docker-compose.scale-ci.yml up -d java-gateway-2
      - name: Verify sharding, propagation, recovery, load, and traces
        run: python scripts/scale_verification.py --report artifacts/scale-report.json
      - name: Collect distributed service logs
        if: failure()
        run: |
          docker compose -f docker-compose.scale-ci.yml ps --all > distributed-services.log
          docker compose -f docker-compose.scale-ci.yml logs --no-color >> distributed-services.log
      - name: Upload distributed acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distributed-scaling-and-tracing
          if-no-files-found: warn
          path: |
            artifacts/scale-report.json
            distributed-services.log
      - name: Stop distributed topology
        if: always()
        run: docker compose -f docker-compose.scale-ci.yml down --volumes --remove-orphans

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-agent/requirements.lock
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install --require-hashes -r python-agent/requirements.lock
          pip install pip-audit==2.9.0
          for attempt in 1 2 3; do
            if pip-audit --requirement python-agent/requirements.lock --timeout 60 \
              --format=json --output=python-audit.json; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Python dependency audit failed after $attempt attempts"
              exit 1
            fi
            echo "Python dependency audit attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
      - name: Scan Java dependencies
        id: java_dependency_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: java-gateway
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          format: json
          output: java-vulnerability-report.json
      - name: Scan repository secrets
        id: secret_scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build runtime images
        run: |
          build_image() {
            local image="$1"
            local context="$2"
            for attempt in 1 2 3; do
              if docker build -t "$image" "$context"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to build $image after $attempt attempts"
                return 1
              fi
              echo "Build attempt $attempt for $image failed; retrying"
              sleep $((attempt * 10))
            done
          }
          build_image mneme-python-agent:p1 python-agent
          build_image mneme-java-gateway:p1 java-gateway
          docker pull qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
          build_image mneme-qdrant:1.20.0 docker/qdrant
          docker image inspect qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2 mneme-qdrant:1.20.0 > vector-image-provenance.json
      - name: Scan Python runtime image
        id: python_image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mneme-python-agent:p1
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: python-image-report.json
      - name: Scan Java runtime image
        id: java_image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mneme-java-gateway:p1
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          format: json
          output: java-image-report.json
      - name: Scan vector database image
        id: vector_image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mneme-qdrant:1.20.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: vector-image-report.json
      - name: Generate Python CycloneDX SBOM
        id: python_sbom
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mneme-python-agent:p1
          format: cyclonedx
          output: mneme-python-agent.cdx.json
      - name: Generate Java CycloneDX SBOM
        id: java_sbom
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mneme-java-gateway:p1
          format: cyclonedx
          output: mneme-java-gateway.cdx.json
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-evidence
          if-no-files-found: warn
          path: |
            *-audit.json
            *-vulnerability-report.json
            *-image-report.json
            vector-image-provenance.json
            *.cdx.json
      - name: Enforce supply-chain policy
        if: always()
        env:
          JAVA_DEPENDENCIES: ${{ steps.java_dependency_scan.outcome }}
          SECRET_SCAN: ${{ steps.secret_scan.outcome }}
          PYTHON_IMAGE: ${{ steps.python_image_scan.outcome }}
          JAVA_IMAGE: ${{ steps.java_image_scan.outcome }}
          VECTOR_IMAGE: ${{ steps.vector_image_scan.outcome }}
          PYTHON_SBOM: ${{ steps.python_sbom.outcome }}
          JAVA_SBOM: ${{ steps.java_sbom.outcome }}
        run: |
          test "$JAVA_DEPENDENCIES" = success
          test "$SECRET_SCAN" = success
          test "$PYTHON_IMAGE" = success
          test "$JAVA_IMAGE" = success
          test "$VECTOR_IMAGE" = success
          test "$PYTHON_SBOM" = success
          test "$JAVA_SBOM" = success
