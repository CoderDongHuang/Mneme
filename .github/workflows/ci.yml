name: Mneme CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-agent/requirements.txt
      - name: Install OCR runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng fonts-noto-cjk
      - run: pip install -r python-agent/requirements.txt pytest "ruff==0.15.17"
      - run: ruff check python-agent/
      - name: Run Python tests
        working-directory: python-agent
        env:
          DEEPSEEK_API_KEY: ci-dummy-key
          DASHSCOPE_API_KEY: ci-dummy-key
          MNEME_OFFLINE_EMBEDDINGS: "true"
        run: python -m pytest tests/ -q
      - name: Run offline RAG baseline
        working-directory: python-agent
        env:
          MNEME_OFFLINE_EMBEDDINGS: "true"
        run: python scripts/evaluate_rag.py --report ../artifacts/rag-quality-report.json
      - name: Run OCR quality gate
        working-directory: python-agent
        env:
          OCR_ENABLED: "true"
          OCR_LANGUAGES: chi_sim+eng
        run: python scripts/evaluate_document_ai.py --report ../artifacts/document-ai-ocr-report.json
      - name: Upload RAG quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-quality-report
          path: |
            artifacts/rag-quality-report.json
            artifacts/document-ai-ocr-report.json

  java:
    name: Java Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build gateway
        working-directory: java-gateway
        run: mvn --batch-mode test

  external-model-quality:
    name: Real OCR and Qwen-VL quality
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-agent/requirements.txt
      - name: Install OCR runtime and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng fonts-noto-cjk
          pip install -r python-agent/requirements.txt
      - name: Run real document AI quality gate
        working-directory: python-agent
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MULTIMODAL_ENABLED: "true"
          MULTIMODAL_MODEL: qwen-vl-plus
          MULTIMODAL_MAX_IMAGES: "1"
          OCR_ENABLED: "true"
          OCR_LANGUAGES: chi_sim+eng
        run: |
          test -n "$DASHSCOPE_API_KEY"
          python scripts/evaluate_document_ai.py --require-multimodal --report ../artifacts/document-ai-external-report.json
      - name: Upload external quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-ai-external-quality
          if-no-files-found: error
          path: artifacts/document-ai-external-report.json

  frontend:
    name: React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run audit
          npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e

  full-stack:
    name: Full-stack P0 acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [python, java, frontend]
    env:
      MYSQL_ROOT_PASSWORD: ci-database-password
      SPRING_DATASOURCE_PASSWORD: ci-database-password
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      INTERNAL_SERVICE_TOKEN: ci-internal-token-at-least-32-characters
      DEEPSEEK_API_KEY: ci-dummy-key
      DASHSCOPE_API_KEY: ci-dummy-key
      MNEME_OFFLINE_EMBEDDINGS: "true"
      MNEME_DETERMINISTIC_TEST_LLM: "true"
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.selfhost.yml -f docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare writable bind mounts
        run: |
          mkdir -p data/files data/avatars data/chroma data/minio python-agent/data
          echo "MNEME_CI_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "MNEME_CI_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Validate and start full stack
        run: |
          $COMPOSE config --quiet
          $COMPOSE up -d --build
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null && curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          $COMPOSE ps
          exit 1
      - name: Run real browser workflow
        working-directory: frontend
        env:
          MNEME_REAL_E2E: "true"
          MNEME_E2E_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-real
        run: npx playwright test e2e/real-stack.spec.js --project=桌面端 --reporter=html
      - name: Run cross-storage deletion fault injection
        run: >-
          python scripts/full_stack_verification.py deletion
          --compose-file docker-compose.yml
          --compose-file docker-compose.selfhost.yml
          --compose-file docker-compose.ci.yml
      - name: Run backup and restore drill
        run: >-
          python scripts/full_stack_verification.py backup-restore
          --compose-file docker-compose.yml
          --compose-file docker-compose.selfhost.yml
          --compose-file docker-compose.ci.yml
      - name: Collect service logs
        if: failure()
        run: $COMPOSE logs --no-color > full-stack-services.log
      - name: Upload P0 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-p0-acceptance
          if-no-files-found: warn
          path: |
            frontend/playwright-report-real/
            frontend/test-results/
            docs/images/mneme-*.png
            backups/ci/
            full-stack-services.log
      - name: Stop full stack
        if: always()
        run: $COMPOSE down --volumes --remove-orphans

  distributed:
    name: Distributed scaling and tracing
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [python, java]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate and start two-node topology
        run: |
          docker compose -f docker-compose.scale-ci.yml config --quiet
          docker compose -f docker-compose.scale-ci.yml build
          docker compose -f docker-compose.scale-ci.yml up -d java-gateway-1
          for attempt in {1..80}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 80 ]; then
              echo "Primary gateway did not become ready after 240 seconds"
              exit 1
            fi
            sleep 3
          done
          docker compose -f docker-compose.scale-ci.yml up -d java-gateway-2
      - name: Verify sharding, propagation, recovery, load, and traces
        run: python scripts/scale_verification.py --report artifacts/scale-report.json
      - name: Collect distributed service logs
        if: failure()
        run: |
          docker compose -f docker-compose.scale-ci.yml ps --all > distributed-services.log
          docker compose -f docker-compose.scale-ci.yml logs --no-color >> distributed-services.log
      - name: Upload distributed acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-scaling-and-tracing
          if-no-files-found: warn
          path: |
            artifacts/scale-report.json
            distributed-services.log
      - name: Stop distributed topology
        if: always()
        run: docker compose -f docker-compose.scale-ci.yml down --volumes --remove-orphans

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-agent/requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r python-agent/requirements.txt pip-audit==2.9.0
          pip-audit --local \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            --format=json --output=python-audit.json
      - name: Scan Java dependencies
        id: java_dependency_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: java-gateway
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: java-vulnerability-report.json
      - name: Scan repository secrets
        id: secret_scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build runtime images
        run: |
          build_image() {
            local image="$1"
            local context="$2"
            for attempt in 1 2 3; do
              if docker build -t "$image" "$context"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to build $image after $attempt attempts"
                return 1
              fi
              echo "Build attempt $attempt for $image failed; retrying"
              sleep $((attempt * 10))
            done
          }
          build_image mneme-python-agent:p1 python-agent
          build_image mneme-java-gateway:p1 java-gateway
      - name: Scan Python runtime image
        id: python_image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mneme-python-agent:p1
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: python-image-report.json
      - name: Scan Java runtime image
        id: java_image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mneme-java-gateway:p1
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: java-image-report.json
      - name: Generate Python CycloneDX SBOM
        id: python_sbom
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mneme-python-agent:p1
          format: cyclonedx
          output: mneme-python-agent.cdx.json
      - name: Generate Java CycloneDX SBOM
        id: java_sbom
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mneme-java-gateway:p1
          format: cyclonedx
          output: mneme-java-gateway.cdx.json
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          if-no-files-found: warn
          path: |
            *-audit.json
            *-vulnerability-report.json
            *-image-report.json
            *.cdx.json
      - name: Enforce supply-chain policy
        if: always()
        env:
          JAVA_DEPENDENCIES: ${{ steps.java_dependency_scan.outcome }}
          SECRET_SCAN: ${{ steps.secret_scan.outcome }}
          PYTHON_IMAGE: ${{ steps.python_image_scan.outcome }}
          JAVA_IMAGE: ${{ steps.java_image_scan.outcome }}
          PYTHON_SBOM: ${{ steps.python_sbom.outcome }}
          JAVA_SBOM: ${{ steps.java_sbom.outcome }}
        run: |
          test "$JAVA_DEPENDENCIES" = success
          test "$SECRET_SCAN" = success
          test "$PYTHON_IMAGE" = success
          test "$JAVA_IMAGE" = success
          test "$PYTHON_SBOM" = success
          test "$JAVA_SBOM" = success
