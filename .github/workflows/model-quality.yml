name: External model quality

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  document-ai:
    name: Real OCR and Qwen-VL quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-agent/requirements.txt
      - name: Install OCR runtime and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng fonts-noto-cjk
          pip install -r python-agent/requirements.txt
      - name: Require model credentials
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: test -n "$DASHSCOPE_API_KEY"
      - name: Validate versioned target-domain dataset
        working-directory: python-agent
        run: python scripts/validate_evaluation_dataset.py evaluation/target_domain_manifest.json
      - name: Run real document AI quality gate
        working-directory: python-agent
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MULTIMODAL_ENABLED: "true"
          MULTIMODAL_MODEL: qwen-vl-plus
          MULTIMODAL_MAX_IMAGES: "1"
          OCR_ENABLED: "true"
          OCR_LANGUAGES: chi_sim+eng
        run: >-
          python scripts/evaluate_document_ai.py
          --require-multimodal
          --dataset evaluation/target_domain_document_ai_cases.json
          --report ../artifacts/document-ai-external-report.json
      - name: Upload external quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-ai-external-quality
          if-no-files-found: error
          path: artifacts/document-ai-external-report.json

  text-and-quiz-quality:
    name: Real RAG and quiz quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-agent/requirements.txt
      - name: Install Python dependencies
        run: pip install -r python-agent/requirements.txt
      - name: Require model credentials
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: test -n "$DASHSCOPE_API_KEY"
      - name: Validate versioned target-domain dataset
        working-directory: python-agent
        run: python scripts/validate_evaluation_dataset.py evaluation/target_domain_manifest.json
      - name: Run budgeted real RAG quality gate
        id: rag_quality
        continue-on-error: true
        working-directory: python-agent
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LLM_FALLBACK_ENABLED: "true"
          MNEME_OFFLINE_EMBEDDINGS: "true"
        run: >-
          python scripts/evaluate_rag.py
          --dataset evaluation/target_domain_rag_cases.json
          --dataset-version 2026.09.20-v1
          --llm-sample-size 8
          --require-sanitized
          --input-cost-per-million 0.30
          --output-cost-per-million 0.60
          --max-estimated-cost 0.03
          --real-llm-thresholds evaluation/real_rag_thresholds.json
          --report ../artifacts/real-rag-quality-report.json
      - name: Run budgeted real quiz quality gate
        id: quiz_quality
        continue-on-error: true
        working-directory: python-agent
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LLM_FALLBACK_ENABLED: "true"
        run: >-
          python scripts/evaluate_quiz_quality.py evaluation/target_domain_quiz_workspace.json
          --llm-sample-size 6
          --require-sanitized
          --input-cost-per-million 0.30
          --output-cost-per-million 0.60
          --max-estimated-cost 0.02
          --thresholds evaluation/real_quiz_thresholds.json
          --report ../artifacts/real-quiz-quality-report.json
      - name: Run budgeted real embedding quality gate
        id: embedding_quality
        continue-on-error: true
        working-directory: python-agent
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MNEME_REQUIRE_REAL_EMBEDDINGS: "true"
        run: >-
          python scripts/evaluate_embedding_quality.py
          --manifest evaluation/target_domain_manifest.json
          --thresholds evaluation/real_embedding_thresholds.json
          --input-cost-per-million 0.30
          --max-estimated-cost 0.01
          --report ../artifacts/real-embedding-quality-report.json
      - name: Compare target-domain reports with baseline
        id: regression
        if: always()
        continue-on-error: true
        working-directory: python-agent
        run: |
          python scripts/compare_quality_reports.py \
            --baseline evaluation/baselines/target_domain_rag_v1.json \
            --candidate ../artifacts/real-rag-quality-report.json \
            --report ../artifacts/target-domain-regression.json
      - name: Upload text quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-text-and-quiz-quality
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/real-rag-quality-report.json
            artifacts/real-quiz-quality-report.json
            artifacts/real-embedding-quality-report.json
            artifacts/target-domain-regression.json
      - name: Enforce all real model quality gates
        if: always()
        env:
          RAG_QUALITY: ${{ steps.rag_quality.outcome }}
          QUIZ_QUALITY: ${{ steps.quiz_quality.outcome }}
          EMBEDDING_QUALITY: ${{ steps.embedding_quality.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
        run: |
          test "$RAG_QUALITY" = success
          test "$QUIZ_QUALITY" = success
          test "$EMBEDDING_QUALITY" = success
          test "$REGRESSION" = success
