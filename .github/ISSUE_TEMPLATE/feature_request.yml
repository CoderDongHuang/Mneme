name: Feature request / 功能建议
description: 描述实际场景、限制和可验证的验收结果
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题与使用场景
      description: 说明谁在什么操作中遇到什么限制，而非只写功能名称
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 当前版本、部署环境与已有替代方法
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 建议方案与验收标准
      description: 给出能测试的行为、兼容性/迁移要求和不包含的范围
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: 合成样例或参考
      description: 请勿提交私人资料、密钥或完整授权头
