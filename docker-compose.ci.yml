services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    user: "${MNEME_CI_UID:-1000}:${MNEME_CI_GID:-1000}"
    command: server /data
    environment:
      MINIO_ROOT_USER: mneme-ci-access
      MINIO_ROOT_PASSWORD: mneme-ci-secret-2026
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 2s
      retries: 30

  java-gateway:
    user: "${MNEME_CI_UID:-1000}:${MNEME_CI_GID:-1000}"
    environment:
      STORAGE_BACKEND: s3
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: mneme-ci-access
      OBJECT_STORAGE_SECRET_KEY: mneme-ci-secret-2026
      OBJECT_STORAGE_BUCKET: mneme
      ACCOUNT_DELETION_POLL_DELAY_MS: 1000
    depends_on:
      minio:
        condition: service_healthy

  python-agent:
    user: "${MNEME_CI_UID:-1000}:${MNEME_CI_GID:-1000}"
    environment:
      MNEME_OFFLINE_EMBEDDINGS: "true"
      MNEME_DETERMINISTIC_TEST_LLM: "true"

  chroma:
    user: "${MNEME_CI_UID:-1000}:${MNEME_CI_GID:-1000}"
