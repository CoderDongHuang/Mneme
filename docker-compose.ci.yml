services:
  minio:
    image: rustfs/rustfs:1.0.0
    user: "${MNEME_CI_UID:-1000}:${MNEME_CI_GID:-1000}"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_ACCESS_KEY: mneme-ci-access
      RUSTFS_SECRET_KEY: mneme-ci-secret-2026
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 3s
      timeout: 2s
      retries: 30

  java-gateway:
    user: "${MNEME_CI_UID:-1000}:${MNEME_CI_GID:-1000}"
    environment:
      STORAGE_BACKEND: s3
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: mneme-ci-access
      OBJECT_STORAGE_SECRET_KEY: mneme-ci-secret-2026
      OBJECT_STORAGE_BUCKET: mneme
      ACCOUNT_DELETION_POLL_DELAY_MS: 1000
    depends_on:
      minio:
        condition: service_healthy

  python-agent:
    user: "${MNEME_CI_UID:-1000}:${MNEME_CI_GID:-1000}"
    environment:
      MNEME_OFFLINE_EMBEDDINGS: "true"
      MNEME_DETERMINISTIC_TEST_LLM: "true"

  chroma:
    user: "${MNEME_CI_UID:-1000}:${MNEME_CI_GID:-1000}"
