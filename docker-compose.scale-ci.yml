services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ci-database-password
      MYSQL_DATABASE: mneme
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent --skip-column-names -e 'SELECT 1 FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME=\"mneme\"' | grep -q 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  mysql-users:
    image: mysql:8.0
    restart: "no"
    entrypoint: ["sh", "/bootstrap/provision-users.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ci-database-password
      MYSQL_GATEWAY_PASSWORD: ci-gateway-password
      MYSQL_AGENT_PASSWORD: ci-agent-password
      MYSQL_MIGRATION_PASSWORD: ci-migration-password
    volumes:
      - ./docker/mysql/provision-users.sh:/bootstrap/provision-users.sh:ro
    depends_on:
      mysql: {condition: service_healthy}

  redis:
    image: redis:7-alpine

  qdrant-1:
    build: ./docker/qdrant
    image: ${MNEME_QDRANT_IMAGE:-mneme-qdrant:1.20.0}
    networks: [vector-backend]
    volumes:
      - scale-qdrant-1:/qdrant/storage
    healthcheck:
      test: [CMD-SHELL, 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.0\r\n\r\n" >&3; read -r status <&3; [[ "$$status" == *"200"* ]]''']
      interval: 3s
      timeout: 3s
      retries: 40

  qdrant-2:
    build: ./docker/qdrant
    image: ${MNEME_QDRANT_IMAGE:-mneme-qdrant:1.20.0}
    networks: [vector-backend]
    volumes:
      - scale-qdrant-2:/qdrant/storage
    healthcheck:
      test: [CMD-SHELL, 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.0\r\n\r\n" >&3; read -r status <&3; [[ "$$status" == *"200"* ]]''']
      interval: 3s
      timeout: 3s
      retries: 40

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

  python-agent-1:
    build:
      context: ./python-agent
      args:
        PYTHON_BASE_IMAGE: ${MNEME_PYTHON_BASE_IMAGE:-python:3.11-slim}
    networks: [default, vector-backend]
    ports:
      - "127.0.0.1:8001:8001"
    environment: &agent-environment
      INTERNAL_SERVICE_TOKEN: ci-internal-token-at-least-32-characters
      ADMIN_API_TOKEN: ci-admin-token-at-least-32-characters
      DEEPSEEK_API_KEY: ci-dummy-key
      DASHSCOPE_API_KEY: ci-dummy-key
      MNEME_OFFLINE_EMBEDDINGS: "true"
      MNEME_DETERMINISTIC_TEST_LLM: "true"
      INTERNAL_RATE_LIMIT_PER_SECOND: "10"
      INTERNAL_RATE_LIMIT_BURST: "60"
      CHROMA_PATH: /legacy-chroma
      VECTOR_STORE_MODE: http
      QDRANT_URL: http://qdrant-1:6333
      VECTOR_SHARD_COUNT: "2"
      VECTOR_SHARD_URLS: http://qdrant-1:6333,http://qdrant-2:6333
      REDIS_HOST: redis
      AUXILIARY_STORE_BACKEND: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: mneme
      MYSQL_USER: mneme_agent
      MYSQL_PASSWORD: ci-agent-password
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_SERVICE_NAME: mneme-python-agent-1
    volumes:
      - scale-chroma-1:/legacy-chroma/1:ro
      - scale-chroma-2:/legacy-chroma/2:ro
      - ./test-fixtures:/test-fixtures:ro
      - scale-agent-1:/app/data
      - scale-files:/data/files
    depends_on:
      mysql-users:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      qdrant-1:
        condition: service_healthy
      qdrant-2:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started

  python-agent-2:
    build:
      context: ./python-agent
      args:
        PYTHON_BASE_IMAGE: ${MNEME_PYTHON_BASE_IMAGE:-python:3.11-slim}
    networks: [default, vector-backend]
    ports:
      - "127.0.0.1:8002:8001"
    environment:
      <<: *agent-environment
      OTEL_SERVICE_NAME: mneme-python-agent-2
    volumes:
      - scale-chroma-1:/legacy-chroma/1:ro
      - scale-chroma-2:/legacy-chroma/2:ro
      - ./test-fixtures:/test-fixtures:ro
      - scale-agent-2:/app/data
      - scale-files:/data/files
    depends_on:
      mysql-users:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      qdrant-1:
        condition: service_healthy
      qdrant-2:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started

  java-gateway-1:
    build: &gateway-build
      context: ./java-gateway
      args:
        MAVEN_BASE_IMAGE: ${MNEME_MAVEN_BASE_IMAGE:-maven:3.9-eclipse-temurin-17}
        JAVA_BASE_IMAGE: ${MNEME_JAVA_BASE_IMAGE:-eclipse-temurin:17-jre-alpine}
    ports:
      - "127.0.0.1:8080:8080"
    environment: &gateway-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mneme
      SPRING_DATASOURCE_USERNAME: mneme_gateway
      SPRING_DATASOURCE_PASSWORD: ci-gateway-password
      SPRING_FLYWAY_USER: mneme_migrator
      SPRING_FLYWAY_PASSWORD: ci-migration-password
      REDIS_HOST: redis
      NOTIFICATION_REDIS_ENABLED: "true"
      PYTHON_AGENT_URL: http://python-agent-1:8001
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      INTERNAL_SERVICE_TOKEN: ci-internal-token-at-least-32-characters
      SECURE_COOKIES: "false"
      FILE_STORAGE_PATH: /data/files
      OTEL_TRACING_ENABLED: "true"
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAME: mneme-java-gateway-1
    volumes:
      - scale-files:/data/files
    depends_on:
      mysql-users:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      python-agent-1:
        condition: service_started

  java-gateway-2:
    build: *gateway-build
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      <<: *gateway-environment
      SPRING_FLYWAY_ENABLED: "false"
      PYTHON_AGENT_URL: http://python-agent-2:8001
      OTEL_SERVICE_NAME: mneme-java-gateway-2
    volumes:
      - scale-files:/data/files
    depends_on:
      mysql-users:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      python-agent-2:
        condition: service_started

volumes:
  scale-chroma-1:
  scale-chroma-2:
  scale-qdrant-1:
  scale-qdrant-2:
  scale-agent-1:
  scale-agent-2:
  scale-files:

networks:
  vector-backend:
    internal: true
