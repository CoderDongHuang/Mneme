server:
  port: 8080

spring:
  application:
    name: ${OTEL_SERVICE_NAME:mneme-java-gateway}
  sql:
    init:
      mode: never
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mneme?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 32MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:false}
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

mneme:
  python-agent-url: ${PYTHON_AGENT_URL:http://localhost:8001}
  jwt-secret: ${JWT_SECRET}
  jwt-expiration: ${JWT_EXPIRATION:86400000}
  file-storage-path: ${FILE_STORAGE_PATH:../data/files}
  storage-backend: ${STORAGE_BACKEND:local}
  object-storage-endpoint: ${OBJECT_STORAGE_ENDPOINT:}
  object-storage-access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
  object-storage-secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
  object-storage-bucket: ${OBJECT_STORAGE_BUCKET:mneme}
  tenant-storage-quota-mb: ${TENANT_STORAGE_QUOTA_MB:2048}
  tenant-knowledge-base-quota: ${TENANT_KNOWLEDGE_BASE_QUOTA:100}
  avatar-storage-path: ${AVATAR_STORAGE_PATH:../data/avatars}
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  internal-service-token-previous: ${INTERNAL_SERVICE_TOKEN_PREVIOUS:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  secure-cookies: ${SECURE_COOKIES:true}
  password-reset-from: ${PASSWORD_RESET_FROM:}
  admin-api-token: ${ADMIN_API_TOKEN:}
  account-deletion-max-attempts: ${ACCOUNT_DELETION_MAX_ATTEMPTS:8}
  account-deletion-poll-delay-ms: ${ACCOUNT_DELETION_POLL_DELAY_MS:3000}
  notification-redis-enabled: ${NOTIFICATION_REDIS_ENABLED:false}
  malware-scan-enabled: ${MALWARE_SCAN_ENABLED:false}
  malware-scan-fail-closed: ${MALWARE_SCAN_FAIL_CLOSED:true}
  clamav-host: ${CLAMAV_HOST:localhost}
  clamav-port: ${CLAMAV_PORT:3310}
  clamav-timeout-ms: ${CLAMAV_TIMEOUT_MS:5000}
